    <script>
      ;(() => {
        const root = document.documentElement
        const savedTheme = localStorage.getItem('ruphak-theme')
        const storedTheme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : null
        const dark = matchMedia('(prefers-color-scheme: dark)').matches
        root.dataset.theme = storedTheme || (dark ? 'dark' : 'light')
        const savedMotion = localStorage.getItem('ruphak-motion')
        const storedMotion = savedMotion === 'lite' || savedMotion === 'full' ? savedMotion : null
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
        const compact = matchMedia('(max-width: 767px)').matches
        root.dataset.motion = reduce ? 'lite' : storedMotion || (compact ? 'lite' : 'full')
      })()
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
