    <script>
      ;(() => {
        const root = document.documentElement
        const read = (key) => {
          try {
            return localStorage.getItem(key)
          } catch {
            return null
          }
        }
        const matches = (query) => matchMedia(query).matches
        const savedTheme = read('ruphak-theme')
        const theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : matches('(prefers-color-scheme: dark)') ? 'dark' : 'light'
        root.dataset.theme = theme
        root.dataset.motion = matches('(prefers-reduced-motion: reduce)') || read('ruphak-motion') === 'lite' ? 'lite' : 'full'
        root.dataset.machine = read('ruphak-machine') === 'off' ? 'off' : 'on'
        root.dataset.plain = read('ruphak-plain') === 'off' ? 'off' : 'on'
        root.dataset.js = '1'
        const color = document.querySelector('meta[name="theme-color"]')
        if (color) color.setAttribute('content', theme === 'dark' ? '#141311' : '#f3eee4')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
